/* =====================================================================
 * 3. participant code、随机分配与状态记录
 * ---------------------------------------------------------------------
 * allocation 节点：
 *   counts/{perception, naturalness}  已分配人数，只能通过 transaction 逐个 +1
 *   participants/{PID}               participant_code, assigned_group, status,
 *                                    claimed_at, assigned_at, first_started_at,
 *                                    started_at, completed_at, attempts
 * status：allocating → assigned → started → completed
 * localStorage 只能识别同一浏览器的重进，换设备/浏览器/无痕模式/清除数据后无法识别。
 * ===================================================================== */
const PID_PATTERN = /^S_[a-z0-9]{12}$/;

function newPid() {
  const alphabet = "abcdefghijklmnopqrstuvwxyz234567";   // 32 个字符，随机字节 & 31 无偏
  const bytes = crypto.getRandomValues(new Uint8Array(12));
  return "S_" + Array.from(bytes, b => alphabet[b & 31]).join("");
}

function loadPid() {
  try {
    const v = localStorage.getItem(PID_STORAGE_KEY);
    return v && PID_PATTERN.test(v) ? v : null;
  } catch (e) { return null; }
}
function storePid(pid) {
  try { localStorage.setItem(PID_STORAGE_KEY, pid); } catch (e) {}
}

function participantRef(pid) { return ALLOC.child("participants").child(pid); }

// 离线时 Firebase 的读写不会报错而是一直等待，这里加超时
function withTimeout(promise) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), NETWORK_TIMEOUT))
  ]);
}

function isFull(c) {
  c = c || {};
  return (c.perception || 0) >= QUOTA.perception && (c.naturalness || 0) >= QUOTA.naturalness;
}

// 分配：重进者沿用原组；新参与者 ① 占位 ② transaction 抽签并 +1 ③ 写入组别
// 抽签概率与剩余名额成正比，最终分配人数恰为 QUOTA，等价于把 80P + 80N 随机排列
// 返回组别；名额已满时返回 null
async function allocate() {
  if (RECORD && RECORD.assigned_group) return RECORD.assigned_group;

  const pid = SUBJECT_ID || newPid();
  const ref = participantRef(pid);
  if (!(RECORD && RECORD.status === "allocating")) {
    await withTimeout(ref.set({ participant_code: pid, status: "allocating", claimed_at: TS }));
  }

  let chosen = null;
  const result = await withTimeout(ALLOC.child("counts").transaction(c => {
    c = c || {};
    const n = { perception: c.perception || 0, naturalness: c.naturalness || 0 };
    const left = {
      perception:  Math.max(QUOTA.perception - n.perception, 0),
      naturalness: Math.max(QUOTA.naturalness - n.naturalness, 0)
    };
    if (left.perception + left.naturalness === 0) { chosen = null; return; }   // 中止 transaction
    chosen = Math.random() * (left.perception + left.naturalness) < left.perception
      ? "perception" : "naturalness";
    n[chosen]++;
    return n;
  }, undefined, false));

  if (!result.committed) {
    await withTimeout(ref.remove());   // 名额已满：撤销占位，不留下记录
    return null;
  }
  await withTimeout(ref.update({ assigned_group: chosen, status: "assigned", assigned_at: TS }));
  SUBJECT_ID = pid;
  storePid(pid);
  return chosen;
}

// 任务开始：status = started，attempts + 1
function markStarted(done) {
  const upd = {
    status: "started",
    started_at: TS,
    attempts: firebase.database.ServerValue.increment(1)
  };
  if (!(RECORD && RECORD.first_started_at)) upd.first_started_at = TS;
  withTimeout(participantRef(SUBJECT_ID).update(upd))
    .then(() => done({ status_saved: true }))
    .catch(err => {
      console.error(err);
      jsPsych.endExperiment(NETWORK_ERROR_MSG);
    });
}

// 保存完整数据，并在同一次原子写入中把 status 设为 completed
function saveComplete(group, payload) {
  const statusPath = `${ALLOC_ROOT}/participants/${SUBJECT_ID}`;
  return db.ref().update({
    [`${DB_ROOT[group]}/${SUBJECT_ID}/complete`]: sanitize(payload),
    [`${statusPath}/status`]: "completed",
    [`${statusPath}/completed_at`]: TS
  });
}

/* =====================================================================
 * 4. perception 任务的试次函数（原 experiment.html 第 3 部分）
 * ---------------------------------------------------------------------
 * audio-keyboard-response 的 rt 从音频开始计时。预加载后读取每条 wav
 * 的实际时长，结束时计算 rt_from_offset = rt − 音频时长。
 * 音频播放期间按键无效（response_allowed_while_playing:false），不会出现负值。
 * 同时记录提交反应时的客户端时间戳 performance.now() 与 Date.now()。
 * ===================================================================== */
const STIM_DURATIONS = {};
let currentStimDuration = null;

function cacheDurations(files) {
  files.forEach(f => {
    jsPsych.pluginAPI.getAudioBuffer(f)
      .then(buf => { STIM_DURATIONS[f] = buf.duration * 1000; })
      .catch(err => console.error("Cannot read duration:", f, err));
  });
}

function keyHintHTML() {
  return `<div class="key-hint">
      <div><b>F</b><br>${bi(LEFT_CAT.zh, LEFT_CAT.en)}</div>
      <div><b>J</b><br>${bi(RIGHT_CAT.zh, RIGHT_CAT.en)}</div>
    </div>`;
}

function audioTrial(stim, phase) {
  return {
    type: jsPsychAudioKeyboardResponse,
    stimulus: stim.file,
    choices: ["f", "j"],
    prompt: keyHintHTML(),
    response_allowed_while_playing: false,
    trial_ends_after_audio: false,
    trial_duration: null,
    data: {
      phase: phase,
      item: stim.item,
      condition: stim.condition,
      intended: stim.intended ?? null,
      stim_file: stim.file,
      correct_category: stim.correct ?? null
    },
    on_start: function (trial) {
      currentStimDuration = STIM_DURATIONS[stim.file] ?? null;
      if (RESPONSE_WINDOW !== null && currentStimDuration !== null) {
        trial.trial_duration = Math.ceil(currentStimDuration) + RESPONSE_WINDOW;
      }
    },
    on_finish: function (data) {
      const tNow = performance.now();
      data.client_response_perf = tNow;
      data.client_response_epoch = Date.now();
      data.stim_duration_ms = currentStimDuration;
      if (data.rt !== null && currentStimDuration !== null) {
        data.rt_from_offset = Math.round(data.rt - currentStimDuration);
        data.client_stim_offset_perf = tNow - data.rt_from_offset;
      } else {
        data.rt_from_offset = null;
        data.client_stim_offset_perf = null;
      }
      data.key = data.response;
      data.response_category = data.response ? CAT_OF[data.response] : null;   // "wh" 或 "ex"
      data.correct = data.correct_category ? data.response_category === data.correct_category : null;
      data.timed_out = data.response === null;
    }
  };
}

/* =====================================================================
 * 5. naturalness 任务的打分页面（原 questionnaire.html 第 3 部分）
 * ---------------------------------------------------------------------
 * 每页一句：进入页面自动播放录音，可点击按钮重听。

 * 记录：rating（1–7）、rationale（选填理由）、play_count（播放次数）。不记录反应时。
 * ===================================================================== */
let stopCurrentAudio = null;

// 播放预加载好的音频；兼容 WebAudio 与 HTML5 Audio 两种模式。返回停止播放的函数
function playAudio(file, onEnded) {
  let stopped = false;
  let stopFn = () => { stopped = true; };
  jsPsych.pluginAPI.getAudioBuffer(file).then(buf => {
    if (stopped) return;
    const ctx = jsPsych.pluginAPI.audioContext();
    if (ctx !== null) {
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.onended = onEnded;
      src.start(ctx.currentTime);
      stopFn = () => { src.onended = null; try { src.stop(); } catch (e) {} };
    } else {
      buf.currentTime = 0;
      buf.onended = onEnded;
      buf.play();
      stopFn = () => { buf.onended = null; buf.pause(); };
    }
  }).catch(err => console.error("Cannot play:", file, err));
  return () => stopFn();
}

function scaleHTML() {
  let radios = "";
  for (let v = SCALE_MIN; v <= SCALE_MAX; v++) {
    radios += `<label>${v}<input type="radio" name="rating" value="${v}" required></label>`;
  }
  return `<div class="scale">${radios}</div>
    <div class="scale-ends">
      <div>${SCALE_MIN} = ${bi(SCALE_LOW.zh, SCALE_LOW.en)}</div>
      <div style="text-align:right">${SCALE_MAX} = ${bi(SCALE_HIGH.zh, SCALE_HIGH.en)}</div>
    </div>`;
}

function ratingTrial(stim, phase, progressText) {
  let playCount = 0;
  let spaceHandler = null;
  const onSpace = (e) => { if (spaceHandler) spaceHandler(e); };
  return {
    type: jsPsychSurveyHtmlForm,
    preamble: `<div class="progress">${progressText}</div>`,
    html: `
      <div class="play-row">
        <button type="button" id="play-btn" class="jspsych-btn">${biBtn("▶ 重听", "▶ Play again")}</button>
        <div id="play-status" class="play-status"></div>
      </div>
      <fieldset id="rating-area" disabled>
        ${p("这句话听起来有多自然？", "How natural does this sentence sound?")}
        ${scaleHTML()}
        <div class="text-left">
          <label for="rationale">${bi("您的理由（选填）", "Your reason (optional)")}</label>
          <textarea id="rationale" name="rationale" class="rationale" rows="3"></textarea>
        </div>
      </fieldset>`,
    button_label: "下一句 / Next",
    data: {
      phase: phase,
      item: stim.item,
      condition: stim.condition,
      f1: stim.f1 ?? null, f2: stim.f2 ?? null, f3: stim.f3 ?? null, f4: stim.f4 ?? null,
      stim_file: stim.file
    },
    on_load: function () {
      const playBtn = document.getElementById("play-btn");
      const status = document.getElementById("play-status");
      const area = document.getElementById("rating-area");
      const nextBtn = document.getElementById("jspsych-survey-html-form-next");
      nextBtn.disabled = true;

      const play = () => {
        playCount++;
        playBtn.disabled = true;
        status.innerHTML = bi("正在播放……", "Playing...");
        stopCurrentAudio = playAudio(stim.file, () => {
          playBtn.disabled = false;
          status.innerHTML = "";
          area.disabled = false;
          nextBtn.disabled = false;
        });
      };
      playBtn.addEventListener("click", play);
      play();

      // 注意力检查页：听完录音后按空格键即通过（在理由框里打字时不算）
      if (phase === "attention_check") {
        spaceHandler = (e) => {
          if (e.key !== " " || area.disabled || e.target.tagName === "TEXTAREA") return;
          e.preventDefault();
          spaceHandler = null;
          document.removeEventListener("keydown", onSpace);
          jsPsych.finishTrial({ pressed_space: true });
        };
        document.addEventListener("keydown", onSpace);
      }
    },
    on_finish: function (data) {
      if (stopCurrentAudio) stopCurrentAudio();
      document.removeEventListener("keydown", onSpace);
      if (phase === "attention_check") {
        data.pressed_space = data.pressed_space === true;
        data.correct = data.pressed_space;
      }
      const resp = data.response || {};
      data.rating = resp.rating ? Number(resp.rating) : null;
      const r = (resp.rationale || "").trim();
      data.rationale = r === "" ? null : r;
      data.play_count = playCount;
      delete data.rt;
      delete data.response;
    }
  };
}

// 注意力检查的位置：把正式试次均分为若干段，每段内随机选一个位置（避开每段开头 3 个试次）
function attentionPositions(n) {
  const segLen = Math.floor(n / ATTENTION_CHECKS);
  return new Set(
    Array.from({ length: ATTENTION_CHECKS }, (_, k) =>
      k * segLen + 3 + Math.floor(Math.random() * (segLen - 4)))
  );
}

      <div class="text-left">
        <h2>${bi("感谢您的参与！", "Thank you for participating!")}</h2>
        ${p("<b>研究说明：</b>在普通话中，“什么”既可以用来提问（疑问词），也可以表示“某个东西”（不定用法）。本问卷收集普通话母语者对不同韵律（如语调、重音、停顿）下这些句子自然度的判断。",
            "<b>About this study:</b> In Mandarin, “shenme” can be used either to ask a question (a wh-word) or to mean “something” (an indefinite). This questionnaire collects native speakers’ judgments of how natural these sentences sound with different prosody, such as intonation, stress, and pauses.")}
        ${p(`如有任何疑问，请联系 ${STUDY.email}。请不要向可能参加本研究的人透露问卷内容。`,
            `If you have any questions, please contact ${STUDY.email}. Please do not discuss the study with others who may participate.`)}
      </div>`,
    choices: [biBtn("完成", "Finish")],
    data: { phase: "debrief" },
    on_finish: function () {
      if (REDIRECT_URL) window.location.href = REDIRECT_URL;
    }
  });

  return tl;
}

timeline.push({ timeline: buildPerceptionTimeline(),  conditional_function: () => GROUP === "perception" });
timeline.push({ timeline: buildNaturalnessTimeline(), conditional_function: () => GROUP === "naturalness" });

/* =====================================================================
 * 9. 启动：先检查本浏览器是否已有编号（已完成 / 重进），以及名额是否已满
 * ===================================================================== */
async function boot() {
  showMessage(p("正在连接服务器，请稍候……", "Connecting, please wait..."));
  try {
    const pid = loadPid();
    if (pid) {
      RECORD = (await withTimeout(participantRef(pid).once("value"))).val();
      if (RECORD) SUBJECT_ID = pid;
    }
    if (RECORD && RECORD.status === "completed") { showMessage(COMPLETED_MSG); return; }
    if (!(RECORD && RECORD.assigned_group)) {
      const counts = (await withTimeout(ALLOC.child("counts").once("value"))).val();
      if (isFull(counts)) { showMessage(FULL_MSG); return; }
    }
  } catch (err) {
    console.error(err);
    showMessage(NETWORK_ERROR_MSG);
    return;
  }
  document.body.innerHTML = "";
  jsPsych.run(timeline);
}

boot();
</script>
</html>
